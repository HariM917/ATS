[pytest]
testpaths = tests
pythonpath = backend
norecursedirs = venv .venv node_modules frontend dist build backend/uploads _legacy __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use test database)
    e2e: End-to-end workflow tests
    regression: AI regression tests (score stability)
